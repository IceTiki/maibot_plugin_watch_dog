[plugin]
config_version = "0.5.0"
enabled = true

# 第一部分：group 与 user 同时匹配，取首条 route；* 包含群聊和私聊。
# 按 use 的顺序进入规则组；组内从上往下检查，首条命中即结束。

# 机器人黑名单，群聊和私聊都生效
[[routes]]
group = ["*"]
user = ["10001"]  # 示例：替换为要完全屏蔽的 QQ
use = ["block"]

# 私聊
[[routes]]
group = ["private"]
user = ["*"]
use = ["common", "native"]

[[routes]]
group = ["20001"]  # 示例互动群
user = ["*"]
use = ["common", "at_bot", "context_only"]

# 普通消息走原生门控的群
[[routes]]
group = [
  "20002",  # 示例原生门控群
]
user = ["*"]
use = ["common", "follow_up", "native"]

# 其他会话；私聊已由上方分流
[[routes]]
group = ["*"]
user = ["*"]
use = ["common", "follow_up", "context_only"]

# 第二部分：键为规则组名称，值为组内按顺序执行的规则。
# condition 省略表示无条件；有多个条件时，全部满足才命中。
# interaction.types 命中其中一项即可；留步动作也支持有效窗口内的追问。
[rule_groups]

block = [
  { action = { kind = "block" } },
]

common = [
  { name = "屏蔽转发消息", condition = [{ kind = "forward" }], action = { kind = "block" } },
  { name = "屏蔽其他戳一戳", condition = [{ kind = "poke_except_bot" }], action = { kind = "block" } },
  { name = "/ping", condition = [{ kind = "text_regex", pattern = "^\\s*/ping\\s*$" }], action = { kind = "block", reply = "pong!" } },
]

at_bot = [
  { condition = [{ kind = "interaction", types = ["at_bot", "reply_to_bot"] }], action = { kind = "native" } },
]

follow_up = [
  { condition = [{ kind = "interaction", types = ["nickname", "at_bot", "reply_to_bot"] }], action = { kind = "follow_up", window_seconds = 60, max_active_seconds = 300 } },
]

native = [
  { action = { kind = "native" } },
]

context_only = [
  { action = { kind = "context_only" } },
]
