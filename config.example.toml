[plugin]
config_version = "0.1.1"
enabled = true

[[rules]]
name = "指定群图文过滤"
enabled = true
scope = "groups"
ids = ["20001"]
reply = "这类消息暂不处理。"
conditions = [{kind = "image"}, {kind = "text_regex", pattern = "广告|推广"}]

[[rules]]
name = "全局转发过滤"
scope = "global"
reply = ""
conditions = [{kind = "forward"}]


[[context_only]]
user_ids = ["10001", "10002"]
planner_pass_probability = 0.05
allow_planner_on_at_bot = true
allow_planner_on_reply_to_bot = true

